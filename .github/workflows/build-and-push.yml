# Builds the Containerfile and pushes the image to GHCR.
# Triggered on push to main and manual workflow_dispatch.

name: build-and-push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/c0dk/chorbar:latest
            ghcr.io/c0dk/chorbar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max